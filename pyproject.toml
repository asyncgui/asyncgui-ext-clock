[project]
name = "asyncgui-ext-clock"
version = "0.6.1"
description = "An event scheduler for asyncgui programs"
authors = [{ name = "Nattōsai Mitō", email = "flow4re2c@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
keywords = ["async"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = ["asyncgui>=0.9.3,<0.10"]

[project.urls]
Documentation = "https://asyncgui.github.io/asyncgui-ext-clock"
Repository = "https://github.com/asyncgui/asyncgui-ext-clock"

[dependency-groups]
dev = ["pytest>=7.4.3,<8"]
doc = [
    "sphinx>=7.2.6,<8",
    "sphinx-autobuild>=2021.3.14,<2022",
    "furo>=2023.9.10,<2024",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "asyncgui_ext"
namespace = true

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
xfail_strict = true
addopts = "--maxfail=4 --strict-markers"
